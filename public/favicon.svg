<svg width="128" height="128" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Squircle Background Gradients -->
    <linearGradient id="fav-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#113630" />
      <stop offset="60%" stop-color="#0B2420" />
      <stop offset="100%" stop-color="#081A17" />
    </linearGradient>

    <linearGradient id="fav-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E9B87" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#225347" stop-opacity="0.6" />
    </linearGradient>

    <!-- Shield Facet Gradients -->
    <linearGradient id="fav-shield-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#113831" />
      <stop offset="50%" stop-color="#0D2621" />
      <stop offset="100%" stop-color="#081A16" />
    </linearGradient>

    <linearGradient id="fav-crest-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8CCBB5" />
      <stop offset="100%" stop-color="#5D9F88" />
    </linearGradient>

    <linearGradient id="fav-crest-r" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9EE0C7" />
      <stop offset="100%" stop-color="#6EB298" />
    </linearGradient>

    <linearGradient id="fav-flank-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#569882" />
      <stop offset="100%" stop-color="#37725F" />
    </linearGradient>

    <linearGradient id="fav-flank-r" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81C4AC" />
      <stop offset="100%" stop-color="#50917D" />
    </linearGradient>

    <linearGradient id="fav-mid-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#42836E" />
      <stop offset="100%" stop-color="#275A4B" />
    </linearGradient>

    <linearGradient id="fav-arrow-top" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#79CDAF" />
      <stop offset="50%" stop-color="#A3E6CC" />
      <stop offset="100%" stop-color="#BAF2DB" />
    </linearGradient>

    <linearGradient id="fav-arrow-shade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#35735F" />
      <stop offset="100%" stop-color="#1B493B" />
    </linearGradient>

    <linearGradient id="fav-star-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="40%" stop-color="#EBA53D" />
      <stop offset="100%" stop-color="#CE8722" />
    </linearGradient>

    <filter id="fav-shield-drop" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.8" flood-color="#071B1A" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer Squircle Tile -->
  <rect x="2" y="2" width="96" height="96" rx="22" fill="url(#fav-bg-grad)" stroke="url(#fav-border-grad)" stroke-width="2.5" />

  <!-- Shield Emblem Scaled Inside -->
  <g transform="translate(14, 11) scale(0.72)" filter="url(#fav-shield-drop)">
    <!-- Base Shield Silhouette -->
    <path
      d="M 48 8 L 14 20 L 16 52 L 50 96 L 84 52 L 86 20 L 52 8 Q 50 18 48 8 Z"
      fill="url(#fav-shield-base)"
      stroke="#1F4E42"
      stroke-width="0.75"
      stroke-linejoin="round"
    />

    <!-- Top Left Crest -->
    <polygon points="48,8 14,20 26,32 48,18" fill="url(#fav-crest-l)" />

    <!-- Top Right Crest -->
    <polygon points="52,8 86,20 74,32 52,18" fill="url(#fav-crest-r)" />

    <!-- Left Outer Flank -->
    <polygon points="14,20 16,52 25,60 26,32" fill="url(#fav-flank-l)" />

    <!-- Right Outer Flank -->
    <polygon points="86,20 84,52 73,68 74,32" fill="url(#fav-flank-r)" />

    <!-- Left Mid Facet -->
    <polygon points="26,32 43,47 25,60" fill="url(#fav-mid-l)" />

    <!-- Lower Left Flank -->
    <polygon points="25,60 38,72 50,77 50,96 16,52" fill="#26594B" />

    <!-- Lower Right Flank -->
    <polygon points="50,96 50,77 62,72 73,68 84,52" fill="#519480" />

    <!-- Bottom Center Ridge Left -->
    <polygon points="50,96 41,75 50,68" fill="#31705D" />
    <!-- Bottom Center Ridge Right -->
    <polygon points="50,96 50,68 59,75" fill="#62A791" />

    <!-- Gold Star -->
    <polygon
      points="50,19 52.2,24.5 58,24.8 53.5,28.5 55.2,34 50,30.5 44.8,34 46.5,28.5 42,24.8 47.8,24.5"
      fill="url(#fav-star-gold)"
      stroke="#FFF1C2"
      stroke-width="0.5"
      stroke-linejoin="round"
    />

    <!-- Arrow Drop Shadow (Depth Layer) -->
    <path
      d="M 23 72 L 43 51 L 49 59 L 69 37 L 66 31 L 79 26 L 82 40 L 75 35 L 53 60 L 43 53 L 26 73 Z"
      fill="#081714"
      opacity="0.75"
    />

    <!-- Arrow Side Shading -->
    <path
      d="M 23 70 L 43 49 L 49 57 L 72 34 L 72 38 L 49 61 L 43 53 L 23 74 Z"
      fill="url(#fav-arrow-shade)"
    />

    <!-- Arrow Main Top Facet -->
    <path
      d="M 23 68 L 42 47 L 48 54 L 71 31 L 63 26 L 82 24 L 76 43 L 71 36 L 48 57 L 42 51 L 23 70 Z"
      fill="url(#fav-arrow-top)"
      stroke="#D8FDF0"
      stroke-width="0.4"
      stroke-linejoin="round"
    />
  </g>
</svg>
